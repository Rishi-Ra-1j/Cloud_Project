apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parse-service
  namespace: app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: parse.local
      http:
        paths:
          - path: /parse
            pathType: Prefix
            backend:
              service:
                name: parse-service
                port:
                  number: 80
